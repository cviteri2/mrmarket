{% extends "base.html" %}
{% block title %}Iniciar sesión — Mercado Tycoon{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Iniciar sesión</h1>
  <form method="post">
    <label>Usuario<input type="text" name="username" required autofocus></label>
    <label>Contraseña<input type="password" name="password" required></label>
    <button type="submit">Entrar</button>
  </form>
  <p>¿No tienes cuenta? <a href="{{ url_for('auth.register') }}">Regístrate</a></p>
</div>
{% endblock %}
